trigger: none
pr: none

pool:
  name: DEFRA-FFC-DEV1-ubuntu2204

variables:
  - group: ffc-pay-automation-dev

steps:
  - checkout: self

  - script: |
      echo "Agent:"
      uname -a

      echo "Node:"
      node --version

      echo "NPM:"
      npm --version

      echo "Chrome:"
      google-chrome --version

      echo "Kubectl:"
      kubectl version --client
    displayName: Check agent

  - script: npm ci
    displayName: Install dependencies

  - script: npx cypress verify
    displayName: Verify Cypress

  - script: |
      npx cypress run \
        --env env=dev,TAGS=@dev \
        --browser chrome \
        --spec "cypress\e2e\features\01_PaymentManagement.feature"
    displayName: Run single DEV test
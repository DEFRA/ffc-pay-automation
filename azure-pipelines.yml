trigger: none
pr: none

pool:
  name: DEFRA-FFC-DEV1-ubuntu2204

variables:
  - group: ffc-pay-automation-dev

steps:
  - checkout: self

  - script: |
      echo "Agent:"
      uname -a

      echo "Node:"
      node --version

      echo "NPM:"
      npm --version

      echo "Chrome:"
      google-chrome --version

      echo "Kubectl:"
      kubectl version --client
    displayName: Check agent

  - script: npm ci
    displayName: Install dependencies

  - script: npx cypress verify
    displayName: Verify Cypress

  - script: |
      echo "Checking Azure CLI authentication..."
      az login

      echo "Checking PostgreSQL access token..."
      az account get-access-token \
        --resource-type oss-rdbms \
        --query accessToken \
        --output tsv > /dev/null

      echo "Access token successfully generated"
    displayName: Check Azure authentication

  - script: |
      npm run cypress:dev:one -- "cypress\e2e\features\14_DocE2EJourney.feature"
    displayName: Run Single test for debugging
    env:
      connectionString: $(connectionString)

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/cypress/reports'
      artifact: 'cypress-report'
    displayName: Publish Cypress report
trigger: none
pr: none

pool:
  name: DEFRA-FFC-DEV1-ubuntu2204

variables:
  - group: ffc-pay-automation-dev

steps:
  - checkout: self

  - script: |
      echo "Agent:"
      uname -a

      echo "Node:"
      node --version

      echo "NPM:"
      npm --version

      echo "Chrome:"
      google-chrome --version

      echo "Kubectl:"
      kubectl version --client
    displayName: Check agent

  - script: npm ci
    displayName: Install dependencies

  - script: npx cypress verify
    displayName: Verify Cypress

  - script: |
      if [ -z "$connectionString" ]; then
        echo "connectionString has not been passed to the Cypress process"
        exit 1
      fi

      echo "Service Bus connection string is available"

      npx cypress run \
        --env env=dev,TAGS=@dev \
        --browser chrome \
        --spec "cypress/e2e/01_PaymentManagement.feature"
    displayName: Run single DEV test
    env:
      connectionString: $(connectionString)